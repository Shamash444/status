# ══════════════════════════════════════════════════════════════
# Page de statut publique de Kyneria
# Propulsée par Upptime — 0 serveur, 0 €, tout tourne sur GitHub.
# Le dépôt est PUBLIC : c'est ce qui rend les GitHub Actions illimitées.
# Aucune clé, aucun secret ne doit apparaître dans ce fichier.
# ══════════════════════════════════════════════════════════════

owner: Shamash444
repo: status

# ── Ce qu'on surveille ────────────────────────────────────────
# ⚠️ La protection anti-robots de Vercel répond 429 à tout client qui
# n'est pas un vrai navigateur (vérifié le 2026-07-27 : www.kyneria.com,
# /login.html, /pricing.html renvoient tous 429 à un curl). Sonder la
# page d'accueil ferait donc clignoter « en panne » 24 h/24 alors que le
# site va très bien.
# On sonde les deux chemins déjà exemptés par les règles de contournement
# Vercel (/robots.txt et /sitemap.xml) : ils sont servis par le MÊME
# déploiement, donc un 200 prouve que le DNS, le CDN et le déploiement
# sont vivants.
sites:
  - name: Site Kyneria
    url: https://www.kyneria.com/robots.txt

  - name: Plan du site (référencement)
    url: https://www.kyneria.com/sitemap.xml

  # Prouve que l'ancien domaine redirige toujours vers le nouveau.
  # Upptime suit la redirection 308 : un 200 ici = la bascule tient.
  - name: Redirection omniasynx.com
    url: https://www.omniasynx.com/robots.txt

  # ⚠️ CES DEUX SONDES ONT MENTI PENDANT UNE PANNE RÉELLE (2026-08-17).
  #
  # Elles interrogeaient `/rest/v1/` et `/auth/v1/health` en attendant un 401.
  # Ces deux adresses sont servies par le PORTIER de Supabase : elles
  # répondent 401 en moins d'une seconde même quand la base est morte.
  # Mesuré côte à côte ce jour-là :
  #
  #     la sonde voyait  : /rest/v1/           → 401 en  0,8 s → « up, 100 % »
  #     le client vivait : /rest/v1/menu_items → 522 en 20,4 s → rien
  #     le client vivait : /auth/v1/token      → 522 en 20,3 s → il ne peut
  #                                                              pas se connecter
  #
  # La page a donc affiché « Base de données : 100 % de disponibilité »
  # pendant que le produit était à l'arrêt. Un indicateur incapable de passer
  # au rouge n'est pas un indicateur, c'est une décoration.
  #
  # Ces deux entrées visent désormais une fonction Edge qui LIT VRAIMENT une
  # ligne en base (et interroge vraiment l'authentification), avec un plafond
  # de 8 secondes : 200 si le service a répondu, 503 sinon.
  # Source : AuraSync/supabase/functions/health-check/index.ts
  #
  # 🔑 La clé reste côté serveur — ce dépôt est public, rien n'y est exposé.
  #    La fonction ne rend aucune donnée : ni ligne, ni compte, ni adresse.
  - name: Base de données
    url: https://ixnaqeysrbrimquvvfqf.supabase.co/functions/v1/health-check

  - name: Authentification
    url: https://ixnaqeysrbrimquvvfqf.supabase.co/functions/v1/health-check?check=auth

# ── La page publique ──────────────────────────────────────────
status-website:
  # Pas de domaine personnalisé pour l'instant : la page vivra sur
  # https://shamash444.github.io/status. Pour passer à status.kyneria.com,
  # il suffira de remplacer baseUrl par « cname: status.kyneria.com »
  # et d'ajouter un CNAME chez Namecheap.
  baseUrl: /status
  name: Statut Kyneria
  introTitle: "État des services **Kyneria**"
  introMessage: >-
    Cette page se met à jour toute seule, toutes les 5 minutes. Elle est
    hébergée en dehors de notre infrastructure : si Kyneria tombe, cette
    page, elle, reste debout.
  navbar:
    - title: Statut
      href: /
    - title: Kyneria
      href: https://www.kyneria.com
  theme: dark
  themeAuto: true

# ── Réglages de surveillance ──────────────────────────────────
# maxResponseTime : au-delà, le service est marqué « dégradé » plutôt
# qu'« en panne » — utile pour voir venir un ralentissement.
maxResponseTime: 8000

commits:
  message: ":robot: mise à jour du statut"

# Les incidents sont ouverts et fermés automatiquement en Issues GitHub.
# Pas de notification e-mail/Slack pour l'instant : à brancher quand Tony
# aura choisi son canal.

# ══════════════════════════════════════════════════════════════
# ⚠️ « Setup CI » et « Update Template CI » sont DÉSACTIVÉS — 2026-07-27
#
# Ces deux workflows réécrivent les fichiers .github/workflows/ pour
# suivre les mises à jour du modèle Upptime. GitHub l'INTERDIT à un
# robot d'Actions, par sécurité :
#   « refusing to allow a GitHub App to create or update workflow
#     response-time.yml without `workflows` permission »
# Aucun réglage de dépôt ne lève ça : il faut un jeton personnel avec la
# portée `workflow`, enregistré en secret sous le nom GH_PAT.
#
# Sans ce jeton, la SURVEILLANCE fonctionne parfaitement — Uptime CI,
# Graphs CI, Summary CI, Response Time CI et Static Site CI lisent ce
# fichier à l'exécution et n'ont besoin d'aucune permission spéciale.
# Seule la mise à jour automatique du modèle est perdue. On les a donc
# coupés plutôt que de laisser deux échecs par jour polluer la boîte
# mail de Tony.
#
# Pour les réactiver un jour :
#   1. github.com/settings/tokens → jeton classique, portées `repo`
#      + `workflow`
#   2. github.com/Shamash444/status/settings/secrets/actions →
#      New secret, nom exact : GH_PAT
#   3. gh workflow enable "Setup CI" -R Shamash444/status
#      gh workflow enable "Update Template CI" -R Shamash444/status
# ══════════════════════════════════════════════════════════════

